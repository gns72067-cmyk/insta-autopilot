<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>인스타 검토</title>
<style>
@font-face{font-family:'Pretendard';src:url('/fonts/Pretendard.woff2') format('woff2');font-weight:45 920;font-display:swap}
:root{
  --bg:#f6f6f4;--panel:#fff;--ink:#17171a;--sub:#6b6b73;--line:#e4e4e0;--accent:#ffcc33;--accent-ink:#1a1400;
  --ok:#1f8a4c;--warn:#b26a00;--bad:#c62828;--info:#2457c5;--chip:#efefeb;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111113;--panel:#1b1b1f;--ink:#ececef;--sub:#9a9aa3;--line:#2c2c32;--chip:#26262b;--accent-ink:#1a1400;
  --ok:#4cc17e;--warn:#e0a03a;--bad:#ef6a6a;--info:#7aa2ff;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Pretendard',system-ui,-apple-system,'Malgun Gothic',sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--info)}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
header .sp{flex:1}
main{max-width:1200px;margin:0 auto;padding:16px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--sub)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
select{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 10px}
.muted{color:var(--sub)}
.small{font-size:13px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--sub);white-space:nowrap}
.badge.review{background:#fff3cd;color:#7a5600}.badge.ready{background:#dff3e6;color:#17663a}.badge.published{background:#e3ebff;color:#2347a8}
.badge.scheduled{background:#ece3ff;color:#5530a8}.badge.failed{background:#fde2e2;color:#9f1d1d}.badge.approved,.badge.manual{background:#dff3e6;color:#17663a}
@media (prefers-color-scheme:dark){.badge.review{background:#4a3b0c;color:#ffd970}.badge.ready,.badge.approved{background:#123b25;color:#7fe0a6}
.badge.published{background:#1b2c55;color:#a9c1ff}.badge.scheduled{background:#2e2150;color:#c9b3ff}.badge.failed{background:#4a1919;color:#ffb3b3}}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:6px;background:var(--chip);color:var(--sub)}
/* 목록 */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.datehead{position:sticky;top:57px;z-index:5;background:var(--bg);padding:10px 0 8px;font-weight:800;font-size:16px;display:flex;gap:8px;align-items:baseline}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.post{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column}
.post:hover{border-color:var(--sub)}
.post .th{aspect-ratio:9/16;background:var(--chip) center/cover no-repeat;position:relative}
.post .th .badge{position:absolute;left:8px;top:8px}
.post .bd{padding:10px 10px 12px;display:flex;flex-direction:column;gap:4px}
.post .tt{font-weight:700;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:40px 16px;text-align:center;color:var(--sub)}
/* 상세 */
.detail{display:grid;grid-template-columns:minmax(260px,400px) 1fr;gap:20px;align-items:start}
@media (max-width:820px){.detail{grid-template-columns:1fr}}
.preview{position:sticky;top:70px}
@media (max-width:820px){.preview{position:static;max-width:360px;margin:0 auto;width:100%}}
.tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.frame{background:#000;border-radius:14px;overflow:hidden;aspect-ratio:9/16;display:flex;align-items:center;justify-content:center}
.frame img,.frame video{width:100%;height:100%;object-fit:contain;display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.auto{font-size:11px;font-weight:700;color:var(--info);border:1px solid currentColor;border-radius:6px;padding:0 6px}
.hv{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;display:block}
.hv.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.hv .nm{font-size:12px;font-weight:700;color:var(--sub);display:flex;gap:6px;align-items:center}
.hv .l1{font-weight:800;font-size:16px}.hv .l2{display:inline;background:linear-gradient(transparent 55%,var(--accent) 55%);font-weight:700}.hv .l3{color:var(--sub);font-size:14px}
.edit label{display:block;font-size:12px;color:var(--sub);margin-top:8px}
.edit input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
.cnt{font-size:12px;color:var(--sub);text-align:right}
.cnt.over{color:var(--bad);font-weight:700}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.ph{border:2px solid transparent;border-radius:10px;overflow:hidden;cursor:pointer;background:var(--chip);position:relative;padding:0}
.ph.on{border-color:var(--accent)}
.ph img{width:100%;aspect-ratio:9/16;object-fit:cover;display:block}
.ph .no{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;font-weight:700;border-radius:5px;padding:0 5px}
.ph.none{display:flex;align-items:center;justify-content:center;aspect-ratio:9/16;font-weight:700;color:var(--sub);font-size:13px;text-align:center}
textarea{width:100%;min-height:260px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;line-height:1.6;resize:vertical}
.msgs{margin:8px 0 0;padding:0;list-style:none;font-size:13px}
.msgs li{padding:2px 0}.msgs .e{color:var(--bad)}.msgs .w{color:var(--warn)}.msgs .o{color:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.claims{font-size:14px;margin:0;padding-left:18px}
.claims li{margin-bottom:6px}
table.pf{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.pf td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
.task{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:40;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;max-width:min(560px,calc(100vw - 32px));box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:14px}
.task pre{white-space:pre-wrap;max-height:180px;overflow:auto;font-size:12px;margin:6px 0 0;opacity:.85}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--panel);border-radius:16px;padding:18px;max-width:440px;width:100%;max-height:calc(100vh - 32px);overflow:auto}
.modal h3{margin:0 0 12px;font-size:17px}
.confirm{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start;margin-bottom:14px}
.confirm img{width:96px;border-radius:8px}
.kv{font-size:14px}.kv b{display:inline-block;min-width:64px;color:var(--sub);font-weight:600}
.login{max-width:360px;margin:12vh auto 0;text-align:center}
.login input{width:100%;font-size:20px;letter-spacing:.15em;text-align:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);text-transform:uppercase;margin:12px 0}
.toast{position:fixed;top:68px;left:50%;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;max-width:calc(100vw - 32px)}
details summary{cursor:pointer;font-weight:700}
</style>
</head>
<body>
<header>
  <h1 id="home" style="cursor:pointer">인스타 검토</h1>
  <span class="sp"></span>
  <select id="acct" aria-label="계정" hidden></select>
  <button class="btn sm ghost" id="logout" hidden>로그아웃</button>
</header>
<main id="app"></main>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}
const app = $("#app");
let state = { overview: null, acct: "", post: null, polling: null };
const STAGE = { brief: "추천", research: "조사", hooks: "훅", photo: "사진", card: "카드", reel: "릴스", caption: "캡션", upload: "업로드" };
const VNAME = { strong: "강력", normal: "보통", soft: "순화" };
const METHOD = { browser: "A · 브라우저(Claude 가 진행)", api: "B · API 자동 게시", manual: "C · 직접 게시" };

async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json", "X-IA": "1" }, body: JSON.stringify(body) };
  const r = await fetch(path, { credentials: "same-origin", ...opt });
  let data = null;
  try { data = await r.json(); } catch (e) {}
  if (r.status === 401 && path !== "/api/login") { showLogin(); throw new Error("login"); }
  if (!r.ok) throw new Error((data && data.error) || ("오류 " + r.status));
  return data;
}
function toast(msg, ms = 3000) {
  const t = h("div", { class: "toast", role: "status" }, msg);
  document.body.append(t); setTimeout(() => t.remove(), ms);
}
function fmtDate(d) {
  const t = new Date(d + "T00:00:00");
  const w = "일월화수목금토"[t.getDay()];
  return `${t.getMonth() + 1}월 ${t.getDate()}일 (${w})`;
}

/* ---------- 로그인 ---------- */
function showLogin(msg) {
  $("#logout").hidden = true; $("#acct").hidden = true;
  const inp = h("input", { id: "code", autocomplete: "one-time-code", placeholder: "접속 코드", maxlength: 14, autocapitalize: "characters" });
  const err = h("div", { class: "small", style: "color:var(--bad);min-height:20px" }, msg || "");
  const go = async () => {
    try { await api("/api/login", { code: inp.value }); route(); }
    catch (e) { err.textContent = e.message; }
  };
  inp.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  app.replaceChildren(h("div", { class: "login" },
    h("h2", {}, "접속 코드를 넣어 주세요"),
    h("p", { class: "muted small" }, "PC 에서 Claude 에게 \"검토 화면 주소 알려줘\" 라고 하면 코드를 알려 줍니다."),
    inp, err, h("button", { class: "btn primary", style: "width:100%", onclick: go }, "들어가기")));
  inp.focus();
}

/* ---------- 목록 ---------- */
async function showList() {
  state.post = null; stopPoll();
  const ov = await api("/api/overview");
  state.overview = ov;
  $("#logout").hidden = false;
  const sel = $("#acct");
  sel.replaceChildren(h("option", { value: "" }, "전체 계정"),
    ...Object.entries(ov.accounts).map(([hd, a]) => h("option", { value: hd }, `${a.alias} (@${hd})`)));
  sel.value = state.acct; sel.hidden = Object.keys(ov.accounts).length < 2;
  const counts = {};
  ov.dates.forEach(d => d.posts.forEach(p => { if (!state.acct || p.handle === state.acct) counts[p.status] = (counts[p.status] || 0) + 1; }));
  const summary = h("div", { class: "toolbar" },
    counts.review ? h("span", { class: "badge review" }, `검토 필요 ${counts.review}`) : null,
    counts.ready ? h("span", { class: "badge ready" }, `업로드 대기 ${counts.ready}`) : null,
    counts.scheduled ? h("span", { class: "badge scheduled" }, `예약 ${counts.scheduled}`) : null,
    counts.failed ? h("span", { class: "badge failed" }, `실패 ${counts.failed}`) : null,
    h("span", { class: "sp", style: "flex:1" }),
    h("button", { class: "btn sm", onclick: showList }, "새로고침"));
  const blocks = [];
  for (const d of ov.dates) {
    const posts = d.posts.filter(p => !state.acct || p.handle === state.acct);
    if (!posts.length) continue;
    blocks.push(h("div", { class: "datehead" }, fmtDate(d.date), d.date === ov.today ? h("span", { class: "chip" }, "오늘") : null,
      h("span", { class: "muted small" }, `${posts.length}개`)));
    blocks.push(h("div", { class: "grid" }, posts.map(p => {
      const a = ov.accounts[p.handle] || { alias: p.handle };
      return h("div", { class: "post", tabindex: 0, onclick: () => go(p.id), onkeydown: e => { if (e.key === "Enter") go(p.id); } },
        h("div", { class: "th", style: p.thumb ? `background-image:url('${p.thumb}')` : "" },
          h("span", { class: "badge " + p.status }, p.status_label)),
        h("div", { class: "bd" },
          h("span", { class: "chip" }, a.alias),
          h("div", { class: "tt" }, p.title || "(제목 없음)"),
          p.permalink ? h("a", { href: p.permalink, target: "_blank", rel: "noopener", class: "small", onclick: e => e.stopPropagation() }, "게시물 보기 ↗") : null));
    })));
  }
  app.replaceChildren(summary, ...(blocks.length ? blocks : [h("div", { class: "empty" },
    h("p", {}, "아직 만든 게시물이 없습니다."),
    h("p", { class: "small" }, "Claude 에게 \"오늘 이슈로 인스타 만들어줘\" 라고 해 보세요."))]));
}
function go(id) { location.hash = "#/p/" + encodeURIComponent(id); }

/* ---------- 상세 ---------- */
async function showPost(id, keepScroll) {
  const y = window.scrollY;
  if (!keepScroll) state.dirtyHook = false;
  const d = await api("/api/post/" + encodeURIComponent(id));
  state.post = d;
  const m = d.meta, st = m.stages || {};
  const auto = m.auto || {};
  const busy = (await api("/api/tasks?post=" + encodeURIComponent(id))).find(t => t.status === "running");

  // 미리보기
  let tab = state.tab || "card";
  const frame = h("div", { class: "frame" });
  const live = makeLive(id, frame);          // 바꾸는 즉시 브라우저에서 카드를 그린다
  const setTab = t => {
    tab = state.tab = t;
    if (t === "card" && live.active) { tabs.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.t === t)); live.show(); return; }
    tabs.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
    const f = { card: d.files["card.png"], grid: d.files["card_grid.png"], guide: d.files["card_guide.png"], reel: d.files["reel.mp4"] }[t];
    if (t === "reel" && (d.reel_stale || !f)) {
      // 수정 후에는 카드만 바로 다시 만든다 — 릴스는 여기서 누르거나, 확정·업로드할 때 자동으로 만든다
      frame.replaceChildren(h("div", { style: "position:relative;width:100%;height:100%" },
        d.files["card.png"] ? h("img", { src: d.files["card.png"], alt: "", style: "opacity:.55" }) : null,
        h("div", { style: "position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;color:#fff;text-align:center;padding:16px" },
          h("div", {}, f ? "카드를 고친 뒤 릴스는 아직 그대로입니다" : "릴스가 아직 없습니다"),
          h("button", { class: "btn primary", disabled: !!busy, onclick: async () => {
            try { watch((await api(`/api/post/${encodeURIComponent(id)}/reel`, {})).task); } catch (e) { toast(e.message); }
          } }, "릴스 만들기 (약 40초)"),
          h("div", { class: "small", style: "opacity:.8" }, "확정·업로드 때 자동으로 만들어지니 꼭 누르지 않아도 됩니다"))));
      return;
    }
    frame.replaceChildren(!f ? h("div", { class: "muted" }, "아직 없음") :
      t === "reel" ? h("video", { src: f, controls: true, playsinline: true, preload: "metadata", poster: d.files["card.png"] || "" }) :
        h("img", { src: f, alt: "" }));
  };
  const tabs = h("div", { class: "tabs" }, [["card", "카드"], ["reel", "릴스"], ["grid", "그리드"], ["guide", "가이드"]]
    .map(([t, n]) => h("button", { "data-t": t, onclick: () => setTab(t) }, n)));
  const issues = Object.values((m.card || {}).results || {}).flatMap(r => r.issues || []);
  const adj = Object.values((m.card || {}).results || {}).flatMap(r => r.adjustments || []);
  const preview = h("div", { class: "preview" }, tabs, frame,
    h("ul", { class: "msgs" },
      issues.map(i => h("li", { class: "e" }, "✘ " + i.msg)),
      adj.length ? h("li", { class: "muted" }, "자동 보정: " + adj.join(", ")) : null,
      m.reel && m.reel.probe ? h("li", { class: "muted" }, `릴스 ${m.reel.probe.duration.toFixed(1)}초 · ${(m.reel.probe.bytes / 1e6).toFixed(1)}MB`) : null));
  setTab(tab);

  // 머리
  const acc = d.account;
  const head = h("div", { class: "card" },
    h("div", { class: "row" }, h("button", { class: "btn sm", onclick: () => { location.hash = ""; } }, "← 목록"),
      h("span", { class: "badge " + d.status }, d.status_label), h("span", { class: "chip" }, acc.alias || acc.handle),
      h("span", { class: "muted small" }, "@" + acc.handle)),
    h("h2", { style: "font-size:18px;margin:10px 0 4px" }, m.title || ""),
    h("div", { class: "muted small" }, `규칙 ${(m.rules || {}).version || "-"} · ` +
      Object.entries(STAGE).map(([k, n]) => `${n} ${({ done: "✓", approved: "✓", waiting_user: "…", failed: "✘", pending: "·", skipped: "–" })[st[k]] || "·"}`).join("  ")));

  // 훅
  const hooksCard = h("div", { class: "card" }, h("h2", {}, "훅", auto.hook && !auto.hook_changed_by_user ? h("span", { class: "auto" }, "자동 선택") : null));
  if (d.hooks) {
    let sel = m.selected_hook || d.hooks.recommended;
    const cur = m.hook || {};
    const inputs = {};
    const edit = h("div", { class: "edit" });
    const fill = v => {
      const base = (v === m.selected_hook && cur.l1) ? cur : d.hooks[v];
      edit.replaceChildren(...["l1", "l2", "l3"].map(k => {
        const lim = { l1: 18, l2: 20, l3: 22 }[k];
        const inp = h("input", { value: base[k] || "", maxlength: 60 });
        const cnt = h("div", { class: "cnt" });
        const upd = () => { cnt.textContent = `${inp.value.length}/${lim}자`; cnt.classList.toggle("over", inp.value.length > lim); };
        inp.addEventListener("input", upd); upd();
        inputs[k] = inp;
        inp.addEventListener("input", () => { state.dirtyHook = true; setTab("card"); live.set({ [k]: inp.value }); });
        return h("div", {}, h("label", {}, { l1: "l1 헤드라인", l2: "l2 강조(마커)", l3: "l3 보조" }[k]), inp, cnt);
      }));
    };
    const list = h("div", {});
    const drawList = () => list.replaceChildren(...["strong", "normal", "soft"].filter(v => d.hooks[v]).map(v => {
      const hv = d.hooks[v], ck = d.hook_checks[v] || {};
      return h("label", { class: "hv" + (v === sel ? " on" : ""), onclick: () => {
        sel = v; drawList(); fill(v); state.dirtyHook = v !== m.selected_hook;

/* ---------- 실시간 미리보기: 검증된 규칙 템플릿을 iframe 에 띄워 renderSlots 를 바로 호출 ---------- */
function makeLive(id, frame) {
  // iframe 은 DOM 에서 옮기면 다시 로드된다 → 상자를 한 번만 만들고, 로드될 때마다 글꼴을 넣고 다시 그린다
  let data = null, iframe = null, box = null, loaded = false, over = {}, timer = null;
  const L = { active: false };
  const draw = async () => {
    if (!loaded) return;
    const variant = over.variant || data.variant;
    const slots = { ...data.slots, l1: over.l1 ?? data.slots.l1, l2: over.l2 ?? data.slots.l2, l3: over.l3 ?? data.slots.l3 };
    slots.photo = variant === "C" ? "" : (over.photo || data.photo || "");
    if (variant === "C") slots.credit = "";
    try { await iframe.contentWindow.renderSlots({ variant, brand: data.brand, slots }); } catch (e) { console.warn(e); }
  };
  const mount = async () => {
    if (!data) data = await api("/api/preview/" + encodeURIComponent(id));
    if (iframe) return;
    const [W, H] = data.size;
    iframe = h("iframe", { src: data.tpl, title: "카드 미리보기", style: `width:${W}px;height:${H}px;border:0;transform-origin:0 0;position:absolute;left:0;top:0;pointer-events:none` });
    iframe.addEventListener("load", () => {
      const d = iframe.contentDocument, st = d.createElement("style");
      st.textContent = "@font-face{font-family:'Pretendard';src:url('/fonts/Pretendard.woff2') format('woff2');font-weight:45 920;font-display:block}" +
        (data.brand_font ? `@font-face{font-family:'IABrandFont';src:url('${data.brand_font}');font-weight:100 900;font-display:block}` : "");

    box = h("div", { style: "position:relative;width:100%;height:100%;overflow:hidden" }, iframe,
      h("span", { class: "chip", style: "position:absolute;right:8px;bottom:8px;opacity:.85" }, "미리보기 · 저장하면 자동 보정"));
    const fit = () => { iframe.style.transform = `scale(${frame.clientWidth / W})`; };
    new ResizeObserver(fit).observe(frame);
  };
  L.show = () => {
    if (!box) return;
    if (!frame.contains(box)) { loaded = false; frame.replaceChildren(box); }
    iframe.style.transform = `scale(${frame.clientWidth / data.size[0]})`;

    try { await mount(); } catch (e) { toast("미리보기를 열지 못했습니다: " + e.message); return; }
    L.active = true;

}

/* ---------- 진행 표시 ---------- */
let bar = null;
function stopPoll() { if (state.polling) clearInterval(state.polling); state.polling = null; }
function watch(tid, quiet) {
  stopPoll();
  if (bar) bar.remove();
  bar = h("div", { class: "task" }, h("span", { class: "spin" }), "작업 중…");
  document.body.append(bar);
  const pid = state.post && state.post.id;
  const tick = async () => {
    let t;
    try { t = (await api("/api/tasks" + (pid ? "?post=" + encodeURIComponent(pid) : ""))).find(x => x.id === tid); } catch (e) { return; }
    if (!t) return;
    const log = h("pre", {}, t.log.join("\n"));
    if (t.status === "running") {
      if (quiet) { bar.replaceChildren(h("span", { class: "spin" }), "저장 중… (미리보기에는 이미 반영됨)"); return; }
      bar.replaceChildren(h("span", { class: "spin" }), t.title + " 중… " + (/릴스|업로드/.test(t.title) ? "(릴스는 40초 안팎)" : "(몇 초)"), log); log.scrollTop = 1e9; return;
    }
    stopPoll();
    const ok = t.status === "done";
    bar.replaceChildren(...[ok ? "✔ " + t.title + " 완료" : "✘ " + t.title + " 실패", ok ? null : log].filter(Boolean),
      h("button", { class: "btn sm", style: "margin-left:10px", onclick: () => { bar.remove(); bar = null; } }, "닫기"));
    if (ok) setTimeout(() => { if (bar) { bar.remove(); bar = null; } }, quiet ? 1500 : 3500);
    // 저장하지 않은 훅 수정이 있으면 화면을 다시 불러오지 않는다(입력한 글자 보존, 미리보기는 이미 최신)
    if (state.post && state.post.id === pid && !(quiet && ok && state.dirtyHook)) showPost(pid, true);
  };
  state.polling = setInterval(tick, 1500); tick();
}

}
